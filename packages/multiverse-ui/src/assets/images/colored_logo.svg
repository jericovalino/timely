<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 48" fill="none">
  <!-- Clock circle -->
  <circle cx="24" cy="24" r="20" stroke="#78035E" stroke-width="2"/>
  <!-- Center dot -->
  <circle cx="24" cy="24" r="2" fill="#78035E"/>
  <!-- Minute hand (pointing to 10 o'clock position) -->
  <line x1="24" y1="24" x2="15" y2="11" stroke="#78035E" stroke-width="2" stroke-linecap="round"/>
  <!-- Hour hand (pointing to 2 o'clock position) -->
  <line x1="24" y1="24" x2="34" y2="15" stroke="#78035E" stroke-width="2" stroke-linecap="round"/>
  <!-- Wordmark -->
  <text x="52" y="22" font-family="Inter, system-ui, sans-serif" font-size="16"
        font-weight="700" fill="#78035E">Timely</text>
  <text x="52" y="38" font-family="Inter, system-ui, sans-serif" font-size="11"
        font-weight="400" letter-spacing="0.1em" fill="#78035E">DTR</text>
</svg>
